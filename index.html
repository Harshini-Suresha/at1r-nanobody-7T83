otesque, system-ui, sans-serif\" font-weight=\"700\" font-size=\"18\" fill=\"#F1F4F5\" text-anchor=\"middle\"\u003e\n\u003ctext x=\"80\" y=\"214\"\u003eA\u003c\u002ftext\u003e\u003ctext x=\"240\" y=\"214\"\u003eB\u003c\u002ftext\u003e\u003ctext x=\"400\" y=\"214\"\u003eC\u003c\u002ftext\u003e\u003ctext x=\"560\" y=\"214\"\u003eD\u003c\u002ftext\u003e\n\u003ctext x=\"80\" y=\"424\"\u003eE\u003c\u002ftext\u003e\u003ctext x=\"240\" y=\"424\"\u003eF\u003c\u002ftext\u003e\u003ctext x=\"400\" y=\"424\"\u003eG\u003c\u002ftext\u003e\u003ctext x=\"560\" y=\"424\"\u003eH\u003c\u002ftext\u003e\n\u003c\u002fg\u003e\n\u003c\u002fsvg\u003e\n\u003cfigcaption style=\"margin-top:12px;font-size:15px;line-height:1.5;color:#A9C3C9\"\u003eThe crystal contains eight copies of the same 128-residue nanobody (chains A to H). Schematic: teal strands are the framework, amber loops are the binding loops. Not drawn from the coordinates.\u003c\u002ffigcaption\u003e\n\u003c\u002ffigure\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fsection\u003e\n\u003c\u002fdiv\u003e\n\n\n\u003c!-- LEGEND --\u003e\n\u003csection style=\"background:#FFF4F6;padding:48px 0\"\u003e\n\u003cdiv style=\"max-width:1200px;margin:0 auto;padding:0 32px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;font-size:16px\"\u003e\n\u003cdiv style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:18px\"\u003eHow to read the tags on this page\u003c\u002fdiv\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:12px 28px\"\u003e\n\u003cdiv style=\"display:flex;gap:10px;align-items:center\"\u003e\u003cspan style=\"display:inline-block;padding:2px 10px;border-radius:999px;background:#DDF0E3;color:#1E6B3A;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:13px;font-weight:700\"\u003eFrom RCSB\u003c\u002fspan\u003e\u003cspan\u003efacts from the PDB entry\u003c\u002fspan\u003e\u003c\u002fdiv\u003e\n\u003cdiv style=\"display:flex;gap:10px;align-items:center\"\u003e\u003cspan style=\"display:inline-block;padding:2px 10px;border-radius:999px;background:#D5EBEE;color:#0F4A52;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:13px;font-weight:700\"\u003eComputed live\u003c\u002fspan\u003e\u003cspan\u003ecalculated in your browser\u003c\u002fspan\u003e\u003c\u002fdiv\u003e\n\u003cdiv style=\"display:flex;gap:10px;align-items:center\"\u003e\u003cspan style=\"display:inline-block;padding:2px 10px;border-radius:999px;background:#FBEBC8;color:#7A4B00;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:13px;font-weight:700\"\u003eIllustrative\u003c\u002fspan\u003e\u003cspan\u003ea teaching sketch, not project data\u003c\u002fspan\u003e\u003c\u002fdiv\u003e\n\u003cdiv style=\"display:flex;gap:10px;align-items:center\"\u003e\u003cspan style=\"display:inline-block;padding:2px 10px;border-radius:999px;background:#DCE9F7;color:#1C4E80;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:13px;font-weight:700\"\u003eFill in\u003c\u002fspan\u003e\u003cspan\u003ea value only the author can supply\u003c\u002fspan\u003e\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fsection\u003e\n\n\u003c!-- STRUCTURE --\u003e\n\u003csection id=\"structure\" style=\"padding:88px 0\"\u003e\n\u003cdiv style=\"max-width:1200px;margin:0 auto;padding:0 32px\"\u003e\n\u003ch2 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:34px;line-height:1.15;letter-spacing:-0.015em\"\u003eThe structure: PDB 7T83\u003c\u002fh2\u003e\n\u003cdiv style=\"margin-bottom:28px\"\u003e\u003cspan style=\"display:inline-block;padding:2px 10px;border-radius:999px;background:#DDF0E3;color:#1E6B3A;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:13px;font-weight:700\"\u003eFrom RCSB\u003c\u002fspan\u003e\u003c\u002fdiv\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:40px 64px;align-items:flex-start\"\u003e\n\u003cdiv style=\"flex:3 1 480px;min-width:0\"\u003e\n\u003csc-for list=\"{{entry}}\" as=\"e\" hint-placeholder-count=\"18\"\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:4px 24px;justify-content:space-between;padding:14px 0;border-bottom:1px solid #E6C3CC;font-size:17px\"\u003e\n\u003cdiv style=\"font-weight:600\"\u003e{{ e.k }}\u003c\u002fdiv\u003e\n\u003cdiv style=\"color:#2E4650;text-align:right\"\u003e{{ e.v }}\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:2 1 320px;min-width:0;max-width:52ch\"\u003e\n\u003ch3 style=\"margin:0 0 14px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:24px;line-height:1.2\"\u003eWhy the title says AT1R\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 16px\"\u003eThe entry contains the nanobody only. It is called an AT1R antagonist because that is what it binds and blocks, not because the receptor is in the crystal. The nanobody was used in work showing that machine learning can predict, and then reduce, antibody-fragment polyreactivity without losing function.\u003c\u002fp\u003e\n\u003cp style=\"margin:0 0 16px;font-size:16px;color:#3F5560\"\u003eRelated entries that do include the receptor are listed under Related structures.\u003c\u002fp\u003e\n\u003ch3 style=\"margin:28px 0 14px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:24px;line-height:1.2\"\u003eWhy one chain is enough\u003c\u002fh3\u003e\n\u003cp style=\"margin:0\"\u003eThe depositors assigned the biological assembly as a monomer, supported by gel filtration. The eight chains in the crystal are eight copies of that monomer, not an eight-part complex. That is the justification for simulating a single chain.\u003c\u002fp\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\n\u003ch3 style=\"margin:64px 0 8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;line-height:1.2\"\u003eEight chains, one sequence\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 24px;max-width:64ch;color:#2E4650\"\u003eChoosing one chain is a real preparation step. Select a chain to see its entry.\u003c\u002fp\u003e\n\u003cdiv role=\"group\" aria-label=\"Chains\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px\"\u003e\n\u003csc-for list=\"{{chains}}\" as=\"c\" hint-placeholder-count=\"8\"\u003e\n\u003cbutton sc-camel-on-click=\"{{ c.pick }}\" aria-pressed=\"{{ c.pressed }}\" style=\"min-width:52px;min-height:48px;padding:8px 16px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:18px;font-weight:700;background:{{ c.bg }};color:{{ c.fg }}\"\u003e{{ c.label }}\u003c\u002fbutton\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003cp style=\"margin:0;max-width:66ch\"\u003e{{ chainText }}\u003c\u002fp\u003e\n\u003cp style=\"margin:12px 0 0;color:#3F5560;font-size:16px\"\u003e[Confirm which chain you kept for simulation, and why.]\u003c\u002fp\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fsection\u003e\n\n\u003c!-- CRYSTAL --\u003e\n\u003csection id=\"crystal\" style=\"background:#FFF4F6;padding:88px 0\"\u003e\n\u003cdiv style=\"max-width:1200px;margin:0 auto;padding:0 32px\"\u003e\n\u003ch2 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:34px;line-height:1.15;letter-spacing:-0.015em\"\u003eThe crystal behind the coordinates\u003c\u002fh2\u003e\n\u003cdiv style=\"margin-bottom:20px\"\u003e\u003cspan style=\"display:inline-block;padding:2px 10px;border-radius:999px;background:#DDF0E3;color:#1E6B3A;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:13px;font-weight:700\"\u003eFrom RCSB\u003c\u002fspan\u003e \u003cspan style=\"display:inline-block;padding:2px 10px;border-radius:999px;background:#D5EBEE;color:#0F4A52;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:13px;font-weight:700\"\u003eComputed live\u003c\u002fspan\u003e\u003c\u002fdiv\u003e\n\u003cp style=\"margin:0 0 40px;max-width:66ch;color:#2E4650\"\u003eThe simulation starts from atoms placed by X-ray diffraction, so it inherits what the crystal did and did not show. The unit cell below uses the deposited cell constants. The calculations that follow are standard crystallographic checks, run on those numbers.\u003c\u002fp\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start\"\u003e\n\u003cdiv style=\"flex:1 1 380px;min-width:0\"\u003e\n\u003csvg sc-camel-view-box=\"0 0 560 360\" role=\"img\" aria-label=\"Monoclinic unit cell drawn in the a-c plane with beta angle 108.64 degrees; the b axis is perpendicular to the page\" style=\"width:100%;height:auto;display:block;background:#FBE8EC;border-radius:6px\"\u003e\n\u003cpolygon points=\"170,310 370,310 302.6,110.2 102.6,110.2\" fill=\"#FFFFFF\" stroke=\"#17555D\" stroke-width=\"4\" stroke-linejoin=\"round\"\u003e\u003c\u002fpolygon\u003e\n\u003cline x1=\"170\" y1=\"310\" x2=\"302.6\" y2=\"110.2\" stroke=\"#C99AA6\" stroke-width=\"2\" stroke-dasharray=\"6 6\"\u003e\u003c\u002fline\u003e\n\u003cpath d=\"M200 310 A30 30 0 0 0 160.4 281.6\" fill=\"none\" stroke=\"#B7791F\" stroke-width=\"3\"\u003e\u003c\u002fpath\u003e\n\u003cg font-family=\"Literata, Georgia, serif\" font-size=\"16\" fill=\"#0F2A35\"\u003e\n\u003ctext x=\"270\" y=\"338\" text-anchor=\"middle\"\u003ea = 80.11 Å\u003c\u002ftext\u003e\n\u003ctext x=\"40\" y=\"215\"\u003ec = 84.44 Å\u003c\u002ftext\u003e\n\u003ctext x=\"212\" y=\"282\"\u003eβ = 108.64°\u003c\u002ftext\u003e\n\u003ctext x=\"280\" y=\"62\" text-anchor=\"middle\"\u003eb = 85.40 Å, perpendicular to the page\u003c\u002ftext\u003e\n\u003ctext x=\"280\" y=\"190\" text-anchor=\"middle\" fill=\"#3F5560\" font-size=\"14\"\u003e2 asymmetric units per cell\u003c\u002ftext\u003e\n\u003ctext x=\"280\" y=\"210\" text-anchor=\"middle\" fill=\"#3F5560\" font-size=\"14\"\u003e8 chains in each\u003c\u002ftext\u003e\n\u003c\u002fg\u003e\n\u003c\u002fsvg\u003e\n\u003cdiv style=\"margin-top:12px;font-size:15px;line-height:1.5;color:#3F5560\"\u003eSpace group P 1 21 1 (monoclinic, with a two-fold screw axis along b). The cell is drawn to the deposited angle; α and γ are 90°.\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:1 1 380px;min-width:0;max-width:58ch\"\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:16px 36px;margin-bottom:28px;font-size:16px\"\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eCell volume\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ vCell }} Å³\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eChain mass (from sequence)\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ chainMassK }} kDa\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003e8 chains + 4 citrate\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ asuMassK }} kDa\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eRCSB total weight\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e114.56 kDa\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003cp style=\"margin:0 0 16px\"\u003eThe two mass figures agree to within about 0.2 kDa, a useful check that the file contains what the sequence says: eight chains of the 128-residue construct plus four citrate ions.\u003c\u002fp\u003e\n\u003cp style=\"margin:0;font-size:16px;color:#3F5560\"\u003eR-free minus R-work is 0.049 (0.257 against 0.208). A gap this size is unremarkable at 2.10 Å and gives no cause for concern about the model fit.\u003c\u002fp\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\n\u003ch3 style=\"margin:64px 0 8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;line-height:1.2\"\u003eWhy eight chains? The Matthews check\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 28px;max-width:68ch;color:#2E4650\"\u003eThe Matthews coefficient is the crystal volume per dalton of protein. Most protein crystals fall between about 1.7 and 3.5 Å³ per dalton, which limits how many chains can fit in the cell. Choose a number of chains per asymmetric unit and see what the cell volume implies.\u003c\u002fp\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start\"\u003e\n\u003cdiv style=\"flex:1 1 340px;min-width:0\"\u003e\n\u003clabel for=\"nch\" style=\"display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16px;margin-bottom:8px\"\u003eChains per asymmetric unit: {{ nchLabel }}\u003c\u002flabel\u003e\n\u003cinput id=\"nch\" type=\"range\" min=\"1\" max=\"12\" step=\"1\" value=\"{{ nchStr }}\" sc-camel-on-change=\"{{ onNch }}\" style=\"width:100%\"\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:20px 36px;margin-top:28px;font-size:16px\"\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eMatthews coefficient\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ vm }} Å³\u002fDa\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eSolvent content\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ solv }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003cp style=\"margin:20px 0 0;font-size:16px;max-width:44ch\"\u003e{{ vmVerdict }}\u003c\u002fp\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:2 1 460px;min-width:0\"\u003e\n\u003cdiv style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16px;margin-bottom:12px\"\u003eMatthews coefficient by number of chains\u003c\u002fdiv\u003e\n\u003csc-for list=\"{{vmBars}}\" as=\"b\" hint-placeholder-count=\"12\"\u003e\n\u003cdiv style=\"display:flex;gap:12px;align-items:center;margin-bottom:6px;font-size:14px\"\u003e\u003cdiv style=\"width:44px;text-align:right;color:#3F5560\"\u003e{{ b.label }}\u003c\u002fdiv\u003e\u003cdiv style=\"flex:1;background:#F2D5DC;border-radius:3px\"\u003e\u003cdiv style=\"height:16px;border-radius:3px;background:{{ b.bg }};width:{{ b.w }}\"\u003e\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\u003cdiv style=\"width:64px\"\u003e{{ b.val }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003c\u002fsc-for\u003e\n\u003cdiv style=\"margin-top:10px;font-size:14px;color:#3F5560\"\u003eTeal: within the usual 1.7 to 3.5 range. Amber: the selected value. Grey: outside the range. Bars are capped at 20.\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fsection\u003e\n\n\u003c!-- SEQUENCE --\u003e\n\u003csection id=\"sequence\" style=\"padding:88px 0\"\u003e\n\u003cdiv style=\"max-width:1200px;margin:0 auto;padding:0 32px\"\u003e\n\u003ch2 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:34px;line-height:1.15;letter-spacing:-0.015em\"\u003eSequence and anatomy\u003c\u002fh2\u003e\n\u003cdiv style=\"margin-bottom:20px\"\u003e\u003cspan style=\"display:inline-block;padding:2px 10px;border-radius:999px;background:#DDF0E3;color:#1E6B3A;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:13px;font-weight:700\"\u003eFrom RCSB\u003c\u002fspan\u003e \u003cspan style=\"display:inline-block;padding:2px 10px;border-radius:999px;background:#D5EBEE;color:#0F4A52;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:13px;font-weight:700\"\u003eComputed live\u003c\u002fspan\u003e\u003c\u002fdiv\u003e\n\u003cp style=\"margin:0 0 40px;max-width:68ch;color:#2E4650\"\u003eA nanobody is one immunoglobulin-like domain. Its core is a beta sandwich, and three loops at one end form the surface that recognises the target. Below are the real 128 residues of AT118i4h32, split into framework and loop regions. Choose a part to highlight it on the sequence.\u003c\u002fp\u003e\n\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;margin-bottom:56px\"\u003e\n\u003cdiv style=\"flex:1 1 420px;min-width:0\"\u003e\n\u003csvg sc-camel-view-box=\"0 0 640 520\" role=\"img\" aria-label=\"Schematic nanobody with six framework strands, three binding loops (CDR1 to CDR3) and a disulfide bridge. The selected part is highlighted in amber.\" style=\"width:100%;height:auto;display:block;background:#FFFFFF;border-radius:6px\"\u003e\n\u003cg fill=\"none\" stroke-linecap=\"round\"\u003e\n\u003cpath d=\"M217 420 Q252 462 287 420\" stroke=\"#0F2A35\" stroke-width=\"3\"\u003e\u003c\u002fpath\u003e\n\u003cpath d=\"M357 420 Q392 462 427 420\" stroke=\"#0F2A35\" stroke-width=\"3\"\u003e\u003c\u002fpath\u003e\n\u003cpath d=\"M130 420 Q108 450 84 470\" stroke=\"#0F2A35\" stroke-width=\"3\"\u003e\u003c\u002fpath\u003e\n\u003cpath d=\"M480 420 Q505 450 532 470\" stroke=\"#0F2A35\" stroke-width=\"3\"\u003e\u003c\u002fpath\u003e\n\u003cpath d=\"M130 230 Q165 150 200 230\" stroke=\"{{ c1S }}\" stroke-width=\"{{ c1W }}\"\u003e\u003c\u002fpath\u003e\n\u003cpath d=\"M270 230 Q305 140 340 230\" stroke=\"{{ c2S }}\" stroke-width=\"{{ c2W }}\"\u003e\u003c\u002fpath\u003e\n\u003cpath d=\"M410 230 C420 60 470 60 480 230\" stroke=\"{{ c3S }}\" stroke-width=\"{{ c3W }}\"\u003e\u003c\u002fpath\u003e\n\u003c\u002fg\u003e\n\u003csc-for list=\"{{strands}}\" as=\"s\" hint-placeholder-count=\"6\"\u003e\n\u003crect x=\"{{ s.x }}\" y=\"230\" width=\"34\" height=\"190\" rx=\"17\" fill=\"{{ s.fill }}\"\u003e\u003c\u002frect\u003e\n\u003c\u002fsc-for\u003e\n\u003cg opacity=\"{{ dsOp }}\"\u003e\n\u003cline x1=\"217\" y1=\"330\" x2=\"393\" y2=\"330\" stroke=\"#B7791F\" stroke-width=\"5\" stroke-dasharray=\"9 7\"\u003e\u003c\u002fline\u003e\n\u003ccircle cx=\"217\" cy=\"330\" r=\"9\" fill=\"#E0A23A\" stroke=\"#0F2A35\" stroke-width=\"3\"\u003e\u003c\u002fcircle\u003e\n\u003ccircle cx=\"393\" cy=\"330\" r=\"9\" fill=\"#E0A23A\" stroke=\"#0F2A35\" stroke-width=\"3\"\u003e\u003c\u002fcircle\u003e\n\u003c\u002fg\u003e\n\u003cg font-family=\"Literata, Georgia, serif\" font-size=\"16\" fill=\"#0F2A35\" text-anchor=\"middle\"\u003e\n\u003ctext x=\"165\" y=\"136\"\u003eCDR1\u003c\u002ftext\u003e\n\u003ctext x=\"305\" y=\"126\"\u003eCDR2\u003c\u002ftext\u003e\n\u003ctext x=\"445\" y=\"46\"\u003eCDR3\u003c\u002ftext\u003e\n\u003ctext x=\"320\" y=\"496\"\u003eFramework beta sandwich\u003c\u002ftext\u003e\n\u003ctext x=\"70\" y=\"494\"\u003eN\u003c\u002ftext\u003e\n\u003ctext x=\"548\" y=\"494\"\u003eC\u003c\u002ftext\u003e\n\u003c\u002fg\u003e\n\u003ctext x=\"14\" y=\"30\" font-family=\"Literata, Georgia, serif\" font-size=\"14\" fill=\"#3F5560\"\u003eTarget-binding end\u003c\u002ftext\u003e\n\u003c\u002fsvg\u003e\n\u003cdiv style=\"margin-top:10px;font-size:15px;color:#3F5560\"\u003eSchematic. Illustrative, not the 7T83 coordinates.\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:1 1 360px;min-width:0\"\u003e\n\u003cdiv role=\"group\" aria-label=\"Nanobody parts\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px\"\u003e\n\u003csc-for list=\"{{regions}}\" as=\"r\" hint-placeholder-count=\"5\"\u003e\n\u003cbutton sc-camel-on-click=\"{{ r.pick }}\" aria-pressed=\"{{ r.pressed }}\" style=\"min-height:44px;padding:8px 16px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;font-weight:700;background:{{ r.bg }};color:{{ r.fg }}\"\u003e{{ r.title }}\u003c\u002fbutton\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003ch3 style=\"margin:0 0 14px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;line-height:1.2\"\u003e{{ region.title }}\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 20px;max-width:56ch\"\u003e{{ region.body }}\u003c\u002fp\u003e\n\u003cp style=\"margin:0;max-width:56ch;font-size:15px;color:#3F5560\"\u003eRegion boundaries use IMGT-style conventions applied to the sequence. They are approximate, so confirm them with a numbering tool before quoting residue ranges.\u003c\u002fp\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\n\u003ch3 style=\"margin:0 0 8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;line-height:1.2\"\u003eThe 128 residues\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 20px;max-width:68ch;color:#2E4650\"\u003eSixteen residues per row, read left to right. Residue 1 is the starting methionine. Light teal is framework, amber is a loop (CDR), rose is the C-terminal tag.\u003c\u002fp\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\"\u003e\n\u003cdiv style=\"flex:1 1 420px;min-width:0;max-width:640px\"\u003e\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px\"\u003e\n\u003csc-for list=\"{{cells}}\" as=\"r\" hint-placeholder-count=\"128\"\u003e\n\u003cdiv title=\"{{ r.tip }}\" style=\"aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:3px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:600;background:{{ r.bg }};color:{{ r.fg }}\"\u003e{{ r.c }}\u003c\u002fdiv\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:1 1 420px;min-width:0\"\u003e\n\u003cdiv style=\"overflow-x:auto\"\u003e\n\u003cdiv style=\"min-width:560px;font-size:15px\"\u003e\n\u003cdiv style=\"display:grid;grid-template-columns:62px 72px 50px minmax(0,1fr) 70px 74px;gap:12px;padding:10px 0;border-bottom:2px solid #0F2A35;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700\"\u003e\u003cdiv\u003eRegion\u003c\u002fdiv\u003e\u003cdiv\u003eResidues\u003c\u002fdiv\u003e\u003cdiv\u003eLength\u003c\u002fdiv\u003e\u003cdiv\u003eSequence\u003c\u002fdiv\u003e\u003cdiv\u003eCharge\u003c\u002fdiv\u003e\u003cdiv\u003eHydropathy\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003csc-for list=\"{{regRows}}\" as=\"g\" hint-placeholder-count=\"9\"\u003e\n\u003cdiv style=\"display:grid;grid-template-columns:62px 72px 50px minmax(0,1fr) 70px 74px;gap:12px;padding:10px 0;border-bottom:1px solid #E6C3CC;line-height:1.4\"\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ g.name }}\u003c\u002fdiv\u003e\u003cdiv\u003e{{ g.range }}\u003c\u002fdiv\u003e\u003cdiv\u003e{{ g.len }}\u003c\u002fdiv\u003e\u003cdiv style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all\"\u003e{{ g.seq }}\u003c\u002fdiv\u003e\u003cdiv\u003e{{ g.q }}\u003c\u002fdiv\u003e\u003cdiv\u003e{{ g.h }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003cp style=\"margin:14px 0 0;font-size:15px;color:#3F5560;max-width:58ch\"\u003eCharge is the count of Lys and Arg minus Asp and Glu, with histidine neutral. Hydropathy is the mean Kyte-Doolittle value, so positive means more hydrophobic. Both are computed from the sequence above.\u003c\u002fp\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\n\u003cdiv style=\"margin-top:48px;display:flex;flex-wrap:wrap;gap:32px 56px\"\u003e\n\u003cdiv style=\"flex:1 1 320px;min-width:0;max-width:58ch\"\u003e\n\u003ch3 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px;line-height:1.25\"\u003eWhat the sequence tells you\u003c\u002fh3\u003e\n\u003cul style=\"margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:17px\"\u003e\n\u003cli\u003eCDR1 is eight residues and carries three arginines and three tyrosines, which makes it strongly positive and aromatic. Loops like this are a common place to look when asking about polyreactivity.\u003c\u002fli\u003e\n\u003cli\u003eCDR3, at twelve residues, is the longest loop, and it contains both an arginine and an aspartate.\u003c\u002fli\u003e\n\u003cli\u003eThere are exactly two cysteines, at positions 24 and 97 in this numbering, matching the conserved disulfide that links the two sheets.\u003c\u002fli\u003e\n\u003cli\u003eAll six histidines sit in the C-terminal tag, so there are no histidine protonation choices to make in the nanobody itself.\u003c\u002fli\u003e\n\u003c\u002ful\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:1 1 320px;min-width:0;max-width:58ch\"\u003e\n\u003ch3 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px;line-height:1.25\"\u003eHow the polyreactivity work relates\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 12px;font-size:17px\"\u003eThe paper that reports 7T83 built sequence-based models of polyreactivity from a synthetic nanobody library and tested them on three nanobody scaffolds. It reports that over 90% of predicted substitutions reduced polyreactivity, including for this AT1R antagonist nanobody, without compromising its function.\u003c\u002fp\u003e\n\u003cp style=\"margin:0;font-size:17px\"\u003eThat makes the sequence features above a natural bridge between the crystal and the simulation: loops with unusual charge or hydropathy are the ones whose dynamics are worth watching.\u003c\u002fp\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fsection\u003e\n\n\u003c!-- WORKFLOW --\u003e\n\u003csection id=\"method\" style=\"background:#FFF4F6;padding:88px 0\"\u003e\n\u003cdiv style=\"max-width:1200px;margin:0 auto;padding:0 32px\"\u003e\n\u003ch2 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:34px;line-height:1.15;letter-spacing:-0.015em\"\u003eMethodology\u003c\u002fh2\u003e\n\u003cp style=\"margin:0 0 32px;max-width:62ch;color:#2E4650\"\u003eSeven stages, from raw coordinates to quantified dynamics. Select a stage to see what was done and which tools were used.\u003c\u002fp\u003e\n\u003cdiv style=\"height:6px;background:#F2D5DC;border-radius:3px;margin-bottom:20px\"\u003e\u003cdiv style=\"height:6px;border-radius:3px;background:#E0A23A;width:{{ progress }}\"\u003e\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv role=\"group\" aria-label=\"Workflow stages\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px\"\u003e\n\u003csc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"7\"\u003e\n\u003cbutton sc-camel-on-click=\"{{ s.pick }}\" aria-pressed=\"{{ s.pressed }}\" style=\"display:flex;gap:12px;align-items:center;min-height:52px;padding:10px 16px;box-sizing:border-box;text-align:left;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;font-weight:700;background:{{ s.bg }};color:{{ s.fg }}\"\u003e\n\u003cspan\u003e{{ s.n }}\u003c\u002fspan\u003e\n\u003cspan\u003e{{ s.title }}\u003c\u002fspan\u003e\n\u003c\u002fbutton\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"padding:36px;background:#FFFFFF;border-radius:6px;display:flex;flex-wrap:wrap;gap:32px 56px\"\u003e\n\u003cdiv style=\"flex:2 1 380px;min-width:0\"\u003e\n\u003ch3 style=\"margin:0 0 16px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:28px;line-height:1.2\"\u003e{{ current.title }}\u003c\u002fh3\u003e\n\u003cp style=\"margin:0;max-width:60ch\"\u003e{{ current.body }}\u003c\u002fp\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:1 1 220px;min-width:0;font-size:16px\"\u003e\n\u003cdiv style=\"margin-bottom:20px\"\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eTools\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ current.tools }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eOutput\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ current.output }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\n\u003ch3 style=\"margin:64px 0 8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;line-height:1.2\"\u003eAnalysis conventions to state\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 24px;max-width:64ch;color:#2E4650\"\u003eRules that make the numbers comparable and reviewable. Confirm each against what you did.\u003c\u002fp\u003e\n\u003cul style=\"margin:0;padding-left:22px;max-width:72ch;display:flex;flex-direction:column;gap:10px\"\u003e\n\u003cli\u003eSay which atoms the RMSD was fitted and calculated on, for example the backbone or only the framework.\u003c\u002fli\u003e\n\u003cli\u003eExclude the equilibration period from every average, and state where production starts.\u003c\u002fli\u003e\n\u003cli\u003eCorrect for periodic boundary conditions before analysis so molecules do not appear to jump across the box.\u003c\u002fli\u003e\n\u003cli\u003eReport the mean together with a spread, not a single value, and say how the spread was estimated.\u003c\u002fli\u003e\n\u003cli\u003eState the reference frame for RMSD and RMSF, usually the first production frame or the energy-minimised structure.\u003c\u002fli\u003e\n\u003cli\u003eReport units and the sampling interval of each curve.\u003c\u002fli\u003e\n\u003c\u002ful\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fsection\u003e\n\n\u003c!-- PREPARATION --\u003e\n\u003csection id=\"prep\" style=\"padding:88px 0\"\u003e\n\u003cdiv style=\"max-width:1200px;margin:0 auto;padding:0 32px\"\u003e\n\u003ch2 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:34px;line-height:1.15;letter-spacing:-0.015em\"\u003ePreparing the structure\u003c\u002fh2\u003e\n\u003cp style=\"margin:0 0 40px;max-width:64ch;color:#2E4650\"\u003eA crystal structure is not ready to simulate. Experimental extras are removed, one chain is chosen, and the result is checked before the topology is built.\u003c\u002fp\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:40px 56px\"\u003e\n\u003cdiv style=\"flex:3 1 480px;min-width:0\"\u003e\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:12px 0;border-bottom:2px solid #0F2A35;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16px\"\u003e\u003cdiv\u003eComponent\u003c\u002fdiv\u003e\u003cdiv\u003eAction\u003c\u002fdiv\u003e\u003cdiv\u003eReason\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003csc-for list=\"{{prepRows}}\" as=\"p\" hint-placeholder-count=\"5\"\u003e\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:18px 0;border-bottom:1px solid #E6C3CC;font-size:16px;line-height:1.55\"\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ p.a }}\u003c\u002fdiv\u003e\u003cdiv\u003e{{ p.b }}\u003c\u002fdiv\u003e\u003cdiv style=\"color:#2E4650\"\u003e{{ p.c }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:2 1 340px;min-width:0\"\u003e\n\u003ch3 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px\"\u003eEquivalent PyMOL commands\u003c\u002fh3\u003e\n\u003cpre style=\"padding:18px;background:#0A2430;color:#E6EEF0;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;overflow-x:auto\"\u003efetch 7T83, async=0\nremove solvent\nremove resn FLC    # citrate\nremove not chain A # confirm your chain\nsave nb_clean.pdb\u003c\u002fpre\u003e\n\u003cp style=\"margin:12px 0 0;font-size:15px;color:#3F5560\"\u003eEdit to match your own workflow. Your preparation was done in BIOVIA; these show the same operations.\u003c\u002fp\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\n\u003ch3 style=\"margin:64px 0 8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;line-height:1.2\"\u003eChecks before building the topology\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 32px;max-width:66ch;color:#2E4650\"\u003eSix things in this particular entry that decide whether the simulation setup goes smoothly.\u003c\u002fp\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:32px 56px\"\u003e\n\u003csc-for list=\"{{checks}}\" as=\"k\" hint-placeholder-count=\"6\"\u003e\n\u003cdiv style=\"flex:1 1 440px;min-width:0;max-width:56ch;padding-top:14px;border-top:2px solid #0F2A35\"\u003e\n\u003cdiv style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:20px;line-height:1.25;margin-bottom:8px\"\u003e{{ k.t }}\u003c\u002fdiv\u003e\n\u003cdiv style=\"font-size:17px;color:#2E4650\"\u003e{{ k.d }}\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fsection\u003e\n\n\u003c!-- SIMULATION --\u003e\n\u003csection id=\"simulation\" style=\"background:#FFF4F6;padding:88px 0\"\u003e\n\u003cdiv style=\"max-width:1200px;margin:0 auto;padding:0 32px\"\u003e\n\u003ch2 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:34px;line-height:1.15;letter-spacing:-0.015em\"\u003eWhat the simulation contains\u003c\u002fh2\u003e\n\u003cp style=\"margin:0 0 40px;max-width:62ch;color:#2E4650\"\u003eThe nanobody sits in a box of water that repeats in every direction, so the system has no surface. GROMACS integrates Newton's equations for every atom in femtosecond steps.\u003c\u002fp\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:center\"\u003e\n\u003cdiv style=\"flex:1 1 440px;min-width:0\"\u003e\n\u003csvg sc-camel-view-box=\"0 0 640 420\" role=\"img\" aria-label=\"Schematic simulation box: one nanobody in the centre surrounded by water molecules and a few ions, with a dashed box edge\" style=\"width:100%;height:auto;display:block\"\u003e\n\u003cdefs\u003e\n\u003cpattern id=\"waterBox\" width=\"30\" height=\"30\" sc-camel-pattern-units=\"userSpaceOnUse\"\u003e\u003ccircle cx=\"7\" cy=\"8\" r=\"2.4\" fill=\"#8FB3BB\"\u003e\u003c\u002fcircle\u003e\u003ccircle cx=\"22\" cy=\"22\" r=\"2.4\" fill=\"#8FB3BB\"\u003e\u003c\u002fcircle\u003e\u003c\u002fpattern\u003e\n\u003c\u002fdefs\u003e\n\u003crect x=\"20\" y=\"20\" width=\"600\" height=\"380\" fill=\"#E7EFF1\"\u003e\u003c\u002frect\u003e\n\u003crect x=\"20\" y=\"20\" width=\"600\" height=\"380\" fill=\"url(#waterBox)\"\u003e\u003c\u002frect\u003e\n\u003crect x=\"20\" y=\"20\" width=\"600\" height=\"380\" fill=\"none\" stroke=\"#17555D\" stroke-width=\"3\" stroke-dasharray=\"10 8\"\u003e\u003c\u002frect\u003e\n\u003crect x=\"250\" y=\"130\" width=\"22\" height=\"130\" rx=\"11\" fill=\"#17555D\"\u003e\u003c\u002frect\u003e\n\u003crect x=\"282\" y=\"130\" width=\"22\" height=\"130\" rx=\"11\" fill=\"#2F8A93\"\u003e\u003c\u002frect\u003e\n\u003crect x=\"314\" y=\"130\" width=\"22\" height=\"130\" rx=\"11\" fill=\"#17555D\"\u003e\u003c\u002frect\u003e\n\u003crect x=\"346\" y=\"130\" width=\"22\" height=\"130\" rx=\"11\" fill=\"#2F8A93\"\u003e\u003c\u002frect\u003e\n\u003cpath d=\"M261 130 Q277 80 293 130\" fill=\"none\" stroke=\"#B7791F\" stroke-width=\"5\" stroke-linecap=\"round\"\u003e\u003c\u002fpath\u003e\n\u003cpath d=\"M325 130 Q341 90 357 130\" fill=\"none\" stroke=\"#B7791F\" stroke-width=\"5\" stroke-linecap=\"round\"\u003e\u003c\u002fpath\u003e\n\u003ccircle cx=\"90\" cy=\"90\" r=\"6\" fill=\"#E0A23A\" stroke=\"#0F2A35\" stroke-width=\"2\"\u003e\u003c\u002fcircle\u003e\n\u003ccircle cx=\"540\" cy=\"320\" r=\"6\" fill=\"#E0A23A\" stroke=\"#0F2A35\" stroke-width=\"2\"\u003e\u003c\u002fcircle\u003e\n\u003ccircle cx=\"120\" cy=\"330\" r=\"6\" fill=\"#E0A23A\" stroke=\"#0F2A35\" stroke-width=\"2\"\u003e\u003c\u002fcircle\u003e\n\u003ccircle cx=\"560\" cy=\"120\" r=\"6\" fill=\"#E0A23A\" stroke=\"#0F2A35\" stroke-width=\"2\"\u003e\u003c\u002fcircle\u003e\n\u003crect x=\"244\" y=\"296\" width=\"130\" height=\"30\" rx=\"4\" fill=\"#E7EFF1\"\u003e\u003c\u002frect\u003e\n\u003ctext x=\"309\" y=\"317\" text-anchor=\"middle\" font-family=\"Literata, Georgia, serif\" font-size=\"17\" fill=\"#0F2A35\"\u003eNanobody\u003c\u002ftext\u003e\n\u003crect x=\"34\" y=\"34\" width=\"106\" height=\"26\" rx=\"4\" fill=\"#E7EFF1\"\u003e\u003c\u002frect\u003e\n\u003ctext x=\"40\" y=\"53\" font-family=\"Literata, Georgia, serif\" font-size=\"15\" fill=\"#0F2A35\"\u003eBox edge\u003c\u002ftext\u003e\n\u003crect x=\"446\" y=\"188\" width=\"150\" height=\"26\" rx=\"4\" fill=\"#E7EFF1\"\u003e\u003c\u002frect\u003e\n\u003ctext x=\"452\" y=\"207\" font-family=\"Literata, Georgia, serif\" font-size=\"15\" fill=\"#0F2A35\"\u003eWater molecules\u003c\u002ftext\u003e\n\u003crect x=\"500\" y=\"336\" width=\"112\" height=\"26\" rx=\"4\" fill=\"#E7EFF1\"\u003e\u003c\u002frect\u003e\n\u003ctext x=\"506\" y=\"355\" font-family=\"Literata, Georgia, serif\" font-size=\"15\" fill=\"#0F2A35\"\u003eIons, if added\u003c\u002ftext\u003e\n\u003c\u002fsvg\u003e\n\u003cdiv style=\"margin-top:12px;font-size:15px;line-height:1.5;color:#3F5560\"\u003eConceptual diagram. Illustrative, not to scale.\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:1 1 340px;min-width:0;max-width:56ch\"\u003e\n\u003cp style=\"margin:0 0 20px\"\u003eThe output is a trajectory: a long series of frames showing how the nanobody moves. Every observable on this page is calculated from that trajectory.\u003c\u002fp\u003e\n\u003cp style=\"margin:0;font-size:16px;color:#3F5560\"\u003eThe crystal gives one averaged, frozen snapshot. Simulation shows which parts of the nanobody stay rigid and which move, in a water environment.\u003c\u002fp\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\n\u003ch3 style=\"margin:72px 0 8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;line-height:1.2\"\u003eScale explorer: how big is the box?\u003c\u002fh3\u003e\n\u003cdiv style=\"margin-bottom:12px\"\u003e\u003cspan style=\"display:inline-block;padding:2px 10px;border-radius:999px;background:#D5EBEE;color:#0F4A52;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:13px;font-weight:700\"\u003eComputed live\u003c\u002fspan\u003e \u003cspan style=\"display:inline-block;padding:2px 10px;border-radius:999px;background:#FBEBC8;color:#7A4B00;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:13px;font-weight:700\"\u003eEstimate\u003c\u002fspan\u003e\u003c\u002fdiv\u003e\n\u003cp style=\"margin:0 0 28px;max-width:66ch;color:#2E4650\"\u003eDrag the padding between the nanobody and the box edge. The estimate assumes a cubic box, a nanobody about 4 nm across with a volume near 17 nm³ and about 1,900 atoms, and liquid water at 33.4 molecules per nm³. Ion pairs assume 0.15 M NaCl. It is a planning aid, not your measured system size.\u003c\u002fp\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start\"\u003e\n\u003cdiv style=\"flex:1 1 340px;min-width:0\"\u003e\n\u003clabel for=\"pad\" style=\"display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16px;margin-bottom:8px\"\u003ePadding: {{ padLabel }} nm\u003c\u002flabel\u003e\n\u003cinput id=\"pad\" type=\"range\" min=\"0.8\" max=\"2\" step=\"0.1\" value=\"{{ padStr }}\" sc-camel-on-change=\"{{ onPad }}\" style=\"width:100%\"\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:20px 36px;margin-top:28px;font-size:16px\"\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eBox edge\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ edge }} nm\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eWater molecules\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ waters }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eTotal atoms\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ atoms }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eShare that is protein\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ protShare }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eIon pairs at 0.15 M\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ ionPairs }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eCost vs 1.0 nm padding\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ relCost }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:2 1 460px;min-width:0\"\u003e\n\u003cdiv style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16px;margin-bottom:12px\"\u003eEstimated atoms by padding\u003c\u002fdiv\u003e\n\u003csc-for list=\"{{padBars}}\" as=\"b\" hint-placeholder-count=\"13\"\u003e\n\u003cdiv style=\"display:flex;gap:12px;align-items:center;margin-bottom:6px;font-size:14px\"\u003e\u003cdiv style=\"width:60px;text-align:right;color:#3F5560\"\u003e{{ b.label }}\u003c\u002fdiv\u003e\u003cdiv style=\"flex:1;background:#F2D5DC;border-radius:3px\"\u003e\u003cdiv style=\"height:16px;border-radius:3px;background:{{ b.bg }};width:{{ b.w }}\"\u003e\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\u003cdiv style=\"width:76px\"\u003e{{ b.val }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\n\u003ch3 style=\"margin:72px 0 8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;line-height:1.2\"\u003eThe simulation protocol, file by file\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 24px;max-width:66ch;color:#2E4650\"\u003eFour stages, each controlled by its own .mdp file. The values shown are typical examples for a small protein, so check each against the files you actually used.\u003c\u002fp\u003e\n\u003cdiv role=\"group\" aria-label=\"Protocol stages\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px\"\u003e\n\u003csc-for list=\"{{mdpTabs}}\" as=\"t\" hint-placeholder-count=\"4\"\u003e\n\u003cbutton sc-camel-on-click=\"{{ t.pick }}\" aria-pressed=\"{{ t.pressed }}\" style=\"min-height:44px;padding:8px 18px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;font-weight:700;background:{{ t.bg }};color:{{ t.fg }}\"\u003e{{ t.name }}\u003c\u002fbutton\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\"\u003e\n\u003cdiv style=\"flex:3 1 420px;min-width:0\"\u003e\n\u003cpre style=\"padding:20px;background:#0A2430;color:#E6EEF0;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.65;overflow-x:auto\"\u003e{{ mdp.code }}\u003c\u002fpre\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:2 1 320px;min-width:0;max-width:52ch\"\u003e\n\u003ch3 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px;line-height:1.25\"\u003e{{ mdp.title }}\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 16px;font-size:17px\"\u003e{{ mdp.why }}\u003c\u002fp\u003e\n\u003cp style=\"margin:0;font-size:15px;color:#3F5560\"\u003e{{ mdp.note }}\u003c\u002fp\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\n\u003ch3 style=\"margin:72px 0 8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;line-height:1.2\"\u003eRun planner\u003c\u002fh3\u003e\n\u003cdiv style=\"margin-bottom:12px\"\u003e\u003cspan style=\"display:inline-block;padding:2px 10px;border-radius:999px;background:#D5EBEE;color:#0F4A52;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:13px;font-weight:700\"\u003eComputed live\u003c\u002fspan\u003e\u003c\u002fdiv\u003e\n\u003cp style=\"margin:0 0 28px;max-width:66ch;color:#2E4650\"\u003eTurn a target length into steps, saved frames and wall time. The time step is fixed at 2 fs, which is typical when bonds to hydrogen are constrained. Throughput depends on your hardware and system size, so enter what your own runs achieved.\u003c\u002fp\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:32px 56px;align-items:flex-start\"\u003e\n\u003cdiv style=\"flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:24px\"\u003e\n\u003cdiv\u003e\u003clabel for=\"plen\" style=\"display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16px;margin-bottom:8px\"\u003eProduction length: {{ lenLabel }} ns\u003c\u002flabel\u003e\u003cinput id=\"plen\" type=\"range\" min=\"10\" max=\"1000\" step=\"10\" value=\"{{ lenStr }}\" sc-camel-on-change=\"{{ onLen }}\" style=\"width:100%\"\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003clabel for=\"pint\" style=\"display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16px;margin-bottom:8px\"\u003eSave a frame every: {{ intLabel }} ps\u003c\u002flabel\u003e\u003cinput id=\"pint\" type=\"range\" min=\"1\" max=\"100\" step=\"1\" value=\"{{ intStr }}\" sc-camel-on-change=\"{{ onInt }}\" style=\"width:100%\"\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003clabel for=\"pspd\" style=\"display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16px;margin-bottom:8px\"\u003eThroughput: {{ spdLabel }} ns per day\u003c\u002flabel\u003e\u003cinput id=\"pspd\" type=\"range\" min=\"10\" max=\"500\" step=\"10\" value=\"{{ spdStr }}\" sc-camel-on-change=\"{{ onSpd }}\" style=\"width:100%\"\u003e\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:1 1 340px;min-width:0;display:flex;flex-wrap:wrap;gap:20px 40px;font-size:16px\"\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eIntegration steps\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ plSteps }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eSaved frames\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ plFrames }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eWall time\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ plWall }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\n\u003ch3 style=\"margin:72px 0 8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;line-height:1.2\"\u003eChoices you make, and what they trade off\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 28px;max-width:66ch;color:#2E4650\"\u003eForce field and water model are chosen together. Use a pairing the force field was developed with, and report both.\u003c\u002fp\u003e\n\u003cdiv style=\"overflow-x:auto\"\u003e\n\u003cdiv style=\"min-width:720px\"\u003e\n\u003cdiv style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2fr);gap:24px;padding:12px 0;border-bottom:2px solid #0F2A35;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16px\"\u003e\u003cdiv\u003eForce field family\u003c\u002fdiv\u003e\u003cdiv\u003eTypical water model\u003c\u002fdiv\u003e\u003cdiv\u003eWorth knowing\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003csc-for list=\"{{ffRows}}\" as=\"f\" hint-placeholder-count=\"4\"\u003e\n\u003cdiv style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2fr);gap:24px;padding:16px 0;border-bottom:1px solid #E6C3CC;font-size:16px;line-height:1.55\"\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ f.a }}\u003c\u002fdiv\u003e\u003cdiv\u003e{{ f.b }}\u003c\u002fdiv\u003e\u003cdiv style=\"color:#2E4650\"\u003e{{ f.c }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\n\u003ch3 style=\"margin:72px 0 12px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;line-height:1.2\"\u003eReference commands\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 20px;max-width:64ch;color:#3F5560;font-size:16px\"\u003eA standard GROMACS pipeline for orientation. Replace the bracketed values and edit to match the commands you actually ran.\u003c\u002fp\u003e\n\u003cpre style=\"padding:20px;background:#0A2430;color:#E6EEF0;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.65;overflow-x:auto\"\u003egmx pdb2gmx -f nb_clean.pdb -o nb.gro -p topol.top -ignh -ff [force field] -water [model]\ngmx editconf -f nb.gro -o box.gro -c -d 1.0 -bt cubic\ngmx solvate -cp box.gro -cs spc216.gro -o solv.gro -p topol.top\ngmx grompp -f ions.mdp -c solv.gro -p topol.top -o ions.tpr\ngmx genion -s ions.tpr -o solv_ions.gro -p topol.top -pname NA -nname CL -neutral -conc 0.15\ngmx grompp -f [em \u002f nvt \u002f npt \u002f md].mdp -c [input].gro -p topol.top -o [stage].tpr\ngmx mdrun -deffnm [stage]\n\ngmx trjconv -s md.tpr -f md.xtc -o md_noPBC.xtc -pbc mol -center\ngmx rms    -s md.tpr -f md_noPBC.xtc -o rmsd.xvg\ngmx rmsf   -s md.tpr -f md_noPBC.xtc -o rmsf.xvg -res\ngmx gyrate -s md.tpr -f md_noPBC.xtc -o gyrate.xvg\ngmx hbond  -s md.tpr -f md_noPBC.xtc -num hbnum.xvg\u003c\u002fpre\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fsection\u003e\n\n\u003c!-- OBSERVABLES --\u003e\n\u003csection id=\"observables\" style=\"padding:88px 0\"\u003e\n\u003cdiv style=\"max-width:1200px;margin:0 auto;padding:0 32px\"\u003e\n\u003ch2 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:34px;line-height:1.15;letter-spacing:-0.015em\"\u003eHow to read the four observables\u003c\u002fh2\u003e\n\u003cdiv style=\"margin-bottom:20px\"\u003e\u003cspan style=\"display:inline-block;padding:2px 10px;border-radius:999px;background:#FBEBC8;color:#7A4B00;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:13px;font-weight:700\"\u003eIllustrative\u003c\u002fspan\u003e\u003c\u002fdiv\u003e\n\u003cp style=\"margin:0 0 32px;max-width:66ch;color:#2E4650\"\u003eEach measure answers a different question. The sketches show what a settled and an unsettled system tend to look like. They are not data from this project. On the RMSF tab the shaded bands mark the real loop and tag positions from the sequence.\u003c\u002fp\u003e\n\u003cdiv role=\"group\" aria-label=\"Observables\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px\"\u003e\n\u003csc-for list=\"{{metricTabs}}\" as=\"t\" hint-placeholder-count=\"4\"\u003e\n\u003cbutton sc-camel-on-click=\"{{ t.pick }}\" aria-pressed=\"{{ t.pressed }}\" style=\"min-height:44px;padding:8px 18px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;font-weight:700;background:{{ t.bg }};color:{{ t.fg }}\"\u003e{{ t.name }}\u003c\u002fbutton\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start\"\u003e\n\u003cdiv style=\"flex:1 1 440px;min-width:0\"\u003e\n\u003csvg sc-camel-view-box=\"0 0 640 310\" role=\"img\" aria-label=\"{{ metric.alt }}\" style=\"width:100%;height:auto;display:block;background:#FFFFFF;border-radius:6px\"\u003e\n\u003csc-if value=\"{{ metric.isRmsf }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n\u003cg\u003e\n\u003csc-for list=\"{{rmsfBands}}\" as=\"b\" hint-placeholder-count=\"4\"\u003e\n\u003cg\u003e\n\u003crect x=\"{{ b.x }}\" y=\"30\" width=\"{{ b.w }}\" height=\"220\" fill=\"{{ b.fill }}\"\u003e\u003c\u002frect\u003e\n\u003ctext x=\"{{ b.cx }}\" y=\"46\" text-anchor=\"middle\" font-family=\"Literata, Georgia, serif\" font-size=\"11\" fill=\"#0F2A35\"\u003e{{ b.label }}\u003c\u002ftext\u003e\n\u003c\u002fg\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fg\u003e\n\u003c\u002fsc-if\u003e\n\u003cg stroke=\"#EBCBD3\" stroke-width=\"1\"\u003e\n\u003cline x1=\"60\" y1=\"30\" x2=\"620\" y2=\"30\"\u003e\u003c\u002fline\u003e\u003cline x1=\"60\" y1=\"85\" x2=\"620\" y2=\"85\"\u003e\u003c\u002fline\u003e\u003cline x1=\"60\" y1=\"140\" x2=\"620\" y2=\"140\"\u003e\u003c\u002fline\u003e\u003cline x1=\"60\" y1=\"195\" x2=\"620\" y2=\"195\"\u003e\u003c\u002fline\u003e\n\u003c\u002fg\u003e\n\u003cline x1=\"60\" y1=\"250\" x2=\"620\" y2=\"250\" stroke=\"#0F2A35\" stroke-width=\"2\"\u003e\u003c\u002fline\u003e\n\u003cline x1=\"60\" y1=\"30\" x2=\"60\" y2=\"250\" stroke=\"#0F2A35\" stroke-width=\"2\"\u003e\u003c\u002fline\u003e\n\u003cpath d=\"{{ metric.pathA }}\" fill=\"none\" stroke=\"#17555D\" stroke-width=\"4\" stroke-linejoin=\"round\"\u003e\u003c\u002fpath\u003e\n\u003csc-if value=\"{{ metric.hasB }}\" hint-placeholder-val=\"{{ true }}\"\u003e\n\u003cpath d=\"{{ metric.pathB }}\" fill=\"none\" stroke=\"#B7791F\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-dasharray=\"10 6\"\u003e\u003c\u002fpath\u003e\n\u003c\u002fsc-if\u003e\n\u003ctext x=\"340\" y=\"292\" text-anchor=\"middle\" font-family=\"Literata, Georgia, serif\" font-size=\"15\" fill=\"#0F2A35\"\u003e{{ metric.xlabel }}\u003c\u002ftext\u003e\n\u003ctext x=\"18\" y=\"140\" text-anchor=\"middle\" transform=\"rotate(-90 18 140)\" font-family=\"Literata, Georgia, serif\" font-size=\"15\" fill=\"#0F2A35\"\u003e{{ metric.ylabel }}\u003c\u002ftext\u003e\n\u003c\u002fsvg\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:14px;font-size:15px\"\u003e\n\u003cdiv style=\"display:flex;gap:10px;align-items:center\"\u003e\u003csvg width=\"36\" height=\"8\" aria-hidden=\"true\"\u003e\u003cline x1=\"0\" y1=\"4\" x2=\"36\" y2=\"4\" stroke=\"#17555D\" stroke-width=\"4\"\u003e\u003c\u002fline\u003e\u003c\u002fsvg\u003e\u003cspan\u003e{{ metric.legendA }}\u003c\u002fspan\u003e\u003c\u002fdiv\u003e\n\u003csc-if value=\"{{ metric.hasB }}\" hint-placeholder-val=\"{{ true }}\"\u003e\n\u003cdiv style=\"display:flex;gap:10px;align-items:center\"\u003e\u003csvg width=\"36\" height=\"8\" aria-hidden=\"true\"\u003e\u003cline x1=\"0\" y1=\"4\" x2=\"36\" y2=\"4\" stroke=\"#B7791F\" stroke-width=\"4\" stroke-dasharray=\"8 4\"\u003e\u003c\u002fline\u003e\u003c\u002fsvg\u003e\u003cspan\u003e{{ metric.legendB }}\u003c\u002fspan\u003e\u003c\u002fdiv\u003e\n\u003c\u002fsc-if\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:1 1 340px;min-width:0;max-width:58ch\"\u003e\n\u003ch3 style=\"margin:0 0 14px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;line-height:1.2\"\u003e{{ metric.name }}\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 18px\"\u003e\u003cstrong\u003eWhat it quantifies.\u003c\u002fstrong\u003e {{ metric.what }}\u003c\u002fp\u003e\n\u003cp style=\"margin:0 0 18px\"\u003e\u003cstrong\u003eHow to read it.\u003c\u002fstrong\u003e {{ metric.read }}\u003c\u002fp\u003e\n\u003cp style=\"margin:0 0 18px\"\u003e\u003cstrong\u003eGROMACS tool.\u003c\u002fstrong\u003e {{ metric.tool }}\u003c\u002fp\u003e\n\u003cp style=\"margin:0;color:#3F5560\"\u003eYour result: {{ metric.result }}\u003c\u002fp\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fsection\u003e\n\n\u003c!-- LIVE LAB --\u003e\n\u003csection id=\"lab\" style=\"background:#FFF4F6;padding:88px 0\"\u003e\n\u003cdiv style=\"max-width:1200px;margin:0 auto;padding:0 32px\"\u003e\n\u003ch2 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:34px;line-height:1.15;letter-spacing:-0.015em\"\u003eLive lab: run it yourself\u003c\u002fh2\u003e\n\u003cdiv style=\"margin-bottom:20px\"\u003e\u003cspan style=\"display:inline-block;padding:2px 10px;border-radius:999px;background:#D5EBEE;color:#0F4A52;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:13px;font-weight:700\"\u003eComputed live\u003c\u002fspan\u003e\u003c\u002fdiv\u003e\n\n\u003ch3 style=\"margin:0 0 8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:28px;line-height:1.2\"\u003eSequence lab\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 24px;max-width:66ch;color:#2E4650\"\u003eIt opens with the real 7T83 sequence. Edit it to model your own chain, for example without the tag, or paste another sequence. Lines beginning with \u0026gt; are ignored.\u003c\u002fp\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\"\u003e\n\u003cdiv style=\"flex:1 1 320px;min-width:0\"\u003e\n\u003clabel for=\"seq\" style=\"display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16px;margin-bottom:8px\"\u003eSequence (one-letter codes)\u003c\u002flabel\u003e\n\u003ctextarea id=\"seq\" value=\"{{ seq }}\" sc-camel-on-change=\"{{ onSeq }}\" rows=\"8\" style=\"width:100%;box-sizing:border-box;padding:14px;border:2px solid #0F2A35;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;background:#FFFFFF;color:#0F2A35;resize:vertical\"\u003e\u003c\u002ftextarea\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\"\u003e\n\u003cbutton sc-camel-on-click=\"{{ loadSeq }}\" style=\"min-height:44px;padding:8px 18px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;background:#0F2A35;color:#FFFFFF;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;font-weight:700\"\u003eLoad 7T83\u003c\u002fbutton\u003e\n\u003cbutton sc-camel-on-click=\"{{ trimTag }}\" style=\"min-height:44px;padding:8px 18px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;background:transparent;color:#0F2A35;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;font-weight:700\"\u003eRemove tag\u003c\u002fbutton\u003e\n\u003cbutton sc-camel-on-click=\"{{ clearSeq }}\" style=\"min-height:44px;padding:8px 18px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;background:transparent;color:#0F2A35;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;font-weight:700\"\u003eClear\u003c\u002fbutton\u003e\n\u003cbutton sc-camel-on-click=\"{{ exportSeq }}\" style=\"min-height:44px;padding:8px 18px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;background:#0F2A35;color:#FFFFFF;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;font-weight:700\"\u003eDownload results (CSV)\u003c\u002fbutton\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:2 1 460px;min-width:0\"\u003e\n\u003csc-if value=\"{{ noSeq }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n\u003cdiv style=\"min-height:240px;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;border:2px dashed #C99AA6;border-radius:6px;background:#FFFFFF;color:#3F5560\"\u003eNo sequence loaded. Paste at least 10 standard residues, or choose Load 7T83.\u003c\u002fdiv\u003e\n\u003c\u002fsc-if\u003e\n\u003csc-if value=\"{{ hasSeq }}\" hint-placeholder-val=\"{{ true }}\"\u003e\n\u003cdiv\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:16px 36px;margin-bottom:24px;font-size:16px\"\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eLength\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ sLen }} residues\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eAverage mass\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ sMass }} kDa\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eFormal charge (default protonation)\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ sFormal }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eCounter-ions to neutralise\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ sIons }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eNet charge at pH 7.4\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ sCharge }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eEstimated pI\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ sPi }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eMean hydropathy\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ sGravy }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16px;margin-bottom:12px\"\u003eComposition by residue class\u003c\u002fdiv\u003e\n\u003csc-for list=\"{{compBars}}\" as=\"c\" hint-placeholder-count=\"5\"\u003e\n\u003cdiv style=\"display:flex;gap:12px;align-items:center;margin-bottom:8px;font-size:15px\"\u003e\u003cdiv style=\"width:150px\"\u003e{{ c.label }}\u003c\u002fdiv\u003e\u003cdiv style=\"flex:1;background:#F2D5DC;border-radius:3px\"\u003e\u003cdiv style=\"height:18px;border-radius:3px;background:#17555D;width:{{ c.w }}\"\u003e\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\u003cdiv style=\"width:92px;text-align:right\"\u003e{{ c.val }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003c\u002fsc-for\u003e\n\u003cdiv style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16px;margin:28px 0 12px\"\u003eHydropathy profile (Kyte-Doolittle, window of 9)\u003c\u002fdiv\u003e\n\u003csvg sc-camel-view-box=\"0 0 640 300\" role=\"img\" aria-label=\"Hydropathy profile along the sequence\" style=\"width:100%;height:auto;display:block;background:#FFFFFF;border-radius:6px\"\u003e\n\u003csc-if value=\"{{ isDefaultSeq }}\" hint-placeholder-val=\"{{ true }}\"\u003e\n\u003cg\u003e\n\u003csc-for list=\"{{hydBands}}\" as=\"b\" hint-placeholder-count=\"3\"\u003e\n\u003cg\u003e\n\u003crect x=\"{{ b.x }}\" y=\"30\" width=\"{{ b.w }}\" height=\"220\" fill=\"#F6DDA8\"\u003e\u003c\u002frect\u003e\n\u003ctext x=\"{{ b.cx }}\" y=\"46\" text-anchor=\"middle\" font-family=\"Literata, Georgia, serif\" font-size=\"11\" fill=\"#0F2A35\"\u003e{{ b.label }}\u003c\u002ftext\u003e\n\u003c\u002fg\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fg\u003e\n\u003c\u002fsc-if\u003e\n\u003cline x1=\"60\" y1=\"140\" x2=\"620\" y2=\"140\" stroke=\"#C99AA6\" stroke-width=\"2\" stroke-dasharray=\"6 6\"\u003e\u003c\u002fline\u003e\n\u003cline x1=\"60\" y1=\"250\" x2=\"620\" y2=\"250\" stroke=\"#0F2A35\" stroke-width=\"2\"\u003e\u003c\u002fline\u003e\n\u003cline x1=\"60\" y1=\"30\" x2=\"60\" y2=\"250\" stroke=\"#0F2A35\" stroke-width=\"2\"\u003e\u003c\u002fline\u003e\n\u003cpath d=\"{{ hydPath }}\" fill=\"none\" stroke=\"#17555D\" stroke-width=\"3\" stroke-linejoin=\"round\"\u003e\u003c\u002fpath\u003e\n\u003ctext x=\"54\" y=\"36\" text-anchor=\"end\" font-family=\"Literata, Georgia, serif\" font-size=\"13\" fill=\"#0F2A35\"\u003ehydrophobic\u003c\u002ftext\u003e\n\u003ctext x=\"54\" y=\"254\" text-anchor=\"end\" font-family=\"Literata, Georgia, serif\" font-size=\"13\" fill=\"#0F2A35\"\u003epolar\u003c\u002ftext\u003e\n\u003ctext x=\"340\" y=\"284\" text-anchor=\"middle\" font-family=\"Literata, Georgia, serif\" font-size=\"14\" fill=\"#3F5560\"\u003eResidue position\u003c\u002ftext\u003e\n\u003c\u002fsvg\u003e\n\u003cp style=\"margin:12px 0 0;font-size:15px;color:#3F5560\"\u003eShaded bands mark the three loops when the 7T83 sequence is loaded. Formal charge assumes the GROMACS default protonation (Lys and Arg positive, Asp and Glu negative, His neutral), which is what genion sees when it neutralises the box. Net charge and pI use standard side-chain pKa values and are estimates.\u003c\u002fp\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fsc-if\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\n\u003ch3 style=\"margin:80px 0 8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:28px;line-height:1.2\"\u003eTrajectory viewer\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 24px;max-width:66ch;color:#2E4650\"\u003ePaste a two-column GROMACS output (the .xvg text from gmx rms, rmsf, gyrate or hbond). Comment lines beginning with # or @ are ignored. The page plots the curve and computes summary statistics, including a first-half versus second-half check for drift.\u003c\u002fp\u003e\n\u003cdiv role=\"group\" aria-label=\"Quantity plotted\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px\"\u003e\n\u003csc-for list=\"{{viewTabs}}\" as=\"v\" hint-placeholder-count=\"4\"\u003e\n\u003cbutton sc-camel-on-click=\"{{ v.pick }}\" aria-pressed=\"{{ v.pressed }}\" style=\"min-height:44px;padding:8px 18px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;font-weight:700;background:{{ v.bg }};color:{{ v.fg }}\"\u003e{{ v.name }}\u003c\u002fbutton\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv role=\"group\" aria-label=\"Smoothing\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;align-items:center\"\u003e\n\u003cspan style=\"font-size:16px;margin-right:4px\"\u003eSmoothing:\u003c\u002fspan\u003e\n\u003csc-for list=\"{{smoothTabs}}\" as=\"m\" hint-placeholder-count=\"3\"\u003e\n\u003cbutton sc-camel-on-click=\"{{ m.pick }}\" aria-pressed=\"{{ m.pressed }}\" style=\"min-height:44px;padding:8px 16px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:15px;font-weight:700;background:{{ m.bg }};color:{{ m.fg }}\"\u003e{{ m.name }}\u003c\u002fbutton\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\"\u003e\n\u003cdiv style=\"flex:1 1 320px;min-width:0\"\u003e\n\u003clabel for=\"xvg\" style=\"display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16px;margin-bottom:8px\"\u003ePaste your data\u003c\u002flabel\u003e\n\u003ctextarea id=\"xvg\" value=\"{{ text }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"# time (ps)   value\n0     0.000\n100   0.112\n200   0.143\" rows=\"12\" style=\"width:100%;box-sizing:border-box;padding:14px;border:2px solid #0F2A35;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;background:#FFFFFF;color:#0F2A35;resize:vertical\"\u003e\u003c\u002ftextarea\u003e\n\u003cbutton sc-camel-on-click=\"{{ clearText }}\" style=\"margin-top:12px;min-height:44px;padding:8px 18px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;background:transparent;color:#0F2A35;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;font-weight:700\"\u003eClear\u003c\u002fbutton\u003e\n\u003cbutton sc-camel-on-click=\"{{ exportTraj }}\" style=\"min-height:44px;padding:8px 18px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;background:#0F2A35;color:#FFFFFF;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;font-weight:700\"\u003eDownload data (CSV)\u003c\u002fbutton\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:2 1 460px;min-width:0\"\u003e\n\u003csc-if value=\"{{ noData }}\" hint-placeholder-val=\"{{ true }}\"\u003e\n\u003cdiv style=\"min-height:300px;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;border:2px dashed #C99AA6;border-radius:6px;background:#FFFFFF;color:#3F5560\"\u003eNo data loaded. Paste at least two rows of numbers to draw the curve.\u003c\u002fdiv\u003e\n\u003c\u002fsc-if\u003e\n\u003csc-if value=\"{{ hasData }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n\u003cdiv\u003e\n\u003csvg sc-camel-view-box=\"0 0 640 310\" role=\"img\" aria-label=\"Line plot of the pasted data\" style=\"width:100%;height:auto;display:block;background:#FFFFFF;border-radius:6px\"\u003e\n\u003cg stroke=\"#F2D5DC\" stroke-width=\"1\"\u003e\n\u003cline x1=\"70\" y1=\"30\" x2=\"620\" y2=\"30\"\u003e\u003c\u002fline\u003e\u003cline x1=\"70\" y1=\"85\" x2=\"620\" y2=\"85\"\u003e\u003c\u002fline\u003e\u003cline x1=\"70\" y1=\"140\" x2=\"620\" y2=\"140\"\u003e\u003c\u002fline\u003e\u003cline x1=\"70\" y1=\"195\" x2=\"620\" y2=\"195\"\u003e\u003c\u002fline\u003e\n\u003c\u002fg\u003e\n\u003cline x1=\"70\" y1=\"250\" x2=\"620\" y2=\"250\" stroke=\"#0F2A35\" stroke-width=\"2\"\u003e\u003c\u002fline\u003e\n\u003cline x1=\"70\" y1=\"30\" x2=\"70\" y2=\"250\" stroke=\"#0F2A35\" stroke-width=\"2\"\u003e\u003c\u002fline\u003e\n\u003cpath d=\"{{ plotPath }}\" fill=\"none\" stroke=\"#17555D\" stroke-width=\"3\" stroke-linejoin=\"round\"\u003e\u003c\u002fpath\u003e\n\u003ctext x=\"64\" y=\"36\" text-anchor=\"end\" font-family=\"Literata, Georgia, serif\" font-size=\"13\" fill=\"#0F2A35\"\u003e{{ yMax }}\u003c\u002ftext\u003e\n\u003ctext x=\"64\" y=\"254\" text-anchor=\"end\" font-family=\"Literata, Georgia, serif\" font-size=\"13\" fill=\"#0F2A35\"\u003e{{ yMin }}\u003c\u002ftext\u003e\n\u003ctext x=\"70\" y=\"272\" text-anchor=\"start\" font-family=\"Literata, Georgia, serif\" font-size=\"13\" fill=\"#0F2A35\"\u003e{{ xMin }}\u003c\u002ftext\u003e\n\u003ctext x=\"620\" y=\"272\" text-anchor=\"end\" font-family=\"Literata, Georgia, serif\" font-size=\"13\" fill=\"#0F2A35\"\u003e{{ xMax }}\u003c\u002ftext\u003e\n\u003ctext x=\"345\" y=\"298\" text-anchor=\"middle\" font-family=\"Literata, Georgia, serif\" font-size=\"14\" fill=\"#3F5560\"\u003e{{ viewName }} against the first column\u003c\u002ftext\u003e\n\u003c\u002fsvg\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:16px 36px;margin-top:20px;font-size:16px\"\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003ePoints\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ nPts }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eMean\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ mean }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eStd. deviation\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ sd }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eMinimum\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ yMin }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eMaximum\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ yMax }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eLast value\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ lastVal }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"margin-top:20px;padding:18px;background:#FBE8EC;border-radius:6px;font-size:16px\"\u003e\n\u003cdiv style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;margin-bottom:6px\"\u003eDrift check\u003c\u002fdiv\u003e\n\u003cdiv\u003eFirst-half mean {{ h1 }}, second-half mean {{ h2 }}, difference {{ hd }}. A small difference relative to the standard deviation suggests the run has settled; a large one suggests it is still drifting.\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fsc-if\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\n\u003ch3 style=\"margin:80px 0 8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:28px;line-height:1.2\"\u003eRMSF to B-factor converter\u003c\u002fh3\u003e\n\u003cp style=\"margin:0 0 24px;max-width:68ch;color:#2E4650\"\u003eThe crystal reports a B-factor for every atom, and a simulation reports RMSF. For isotropic motion they are linked by B = (8π²\u002f3) × RMSF². Paste per-residue RMSF to see the B-factor equivalent, which you can compare with the B-factors in the PDB file for the same chain.\u003c\u002fp\u003e\n\u003cdiv role=\"group\" aria-label=\"RMSF units\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;align-items:center\"\u003e\n\u003cspan style=\"font-size:16px;margin-right:4px\"\u003eInput units:\u003c\u002fspan\u003e\n\u003csc-for list=\"{{unitTabs}}\" as=\"u\" hint-placeholder-count=\"2\"\u003e\n\u003cbutton sc-camel-on-click=\"{{ u.pick }}\" aria-pressed=\"{{ u.pressed }}\" style=\"min-height:44px;padding:8px 16px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:15px;font-weight:700;background:{{ u.bg }};color:{{ u.fg }}\"\u003e{{ u.name }}\u003c\u002fbutton\u003e\n\u003c\u002fsc-for\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\"\u003e\n\u003cdiv style=\"flex:1 1 320px;min-width:0\"\u003e\n\u003clabel for=\"rmsfIn\" style=\"display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16px;margin-bottom:8px\"\u003ePaste RMSF per residue\u003c\u002flabel\u003e\n\u003ctextarea id=\"rmsfIn\" value=\"{{ btext }}\" sc-camel-on-change=\"{{ onB }}\" placeholder=\"# residue   rmsf (nm)\n1   0.150\n2   0.121\n3   0.098\" rows=\"10\" style=\"width:100%;box-sizing:border-box;padding:14px;border:2px solid #0F2A35;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;background:#FFFFFF;color:#0F2A35;resize:vertical\"\u003e\u003c\u002ftextarea\u003e\n\u003cbutton sc-camel-on-click=\"{{ clearB }}\" style=\"margin-top:12px;min-height:44px;padding:8px 18px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;background:transparent;color:#0F2A35;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;font-weight:700\"\u003eClear\u003c\u002fbutton\u003e\n\u003cbutton sc-camel-on-click=\"{{ exportBFac }}\" style=\"min-height:44px;padding:8px 18px;cursor:pointer;border:2px solid #0F2A35;border-radius:6px;background:#0F2A35;color:#FFFFFF;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;font-weight:700\"\u003eDownload B-factors (CSV)\u003c\u002fbutton\u003e\n\u003c\u002fdiv\u003e\n\u003cdiv style=\"flex:2 1 460px;min-width:0\"\u003e\n\u003csc-if value=\"{{ noB }}\" hint-placeholder-val=\"{{ true }}\"\u003e\n\u003cdiv style=\"min-height:240px;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;border:2px dashed #C99AA6;border-radius:6px;background:#FFFFFF;color:#3F5560\"\u003eNo data loaded. Paste at least two rows of residue and RMSF values.\u003c\u002fdiv\u003e\n\u003c\u002fsc-if\u003e\n\u003csc-if value=\"{{ hasB }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n\u003cdiv\u003e\n\u003csvg sc-camel-view-box=\"0 0 640 300\" role=\"img\" aria-label=\"B-factor equivalent of the pasted RMSF values along the residues\" style=\"width:100%;height:auto;display:block;background:#FFFFFF;border-radius:6px\"\u003e\n\u003cline x1=\"70\" y1=\"250\" x2=\"620\" y2=\"250\" stroke=\"#0F2A35\" stroke-width=\"2\"\u003e\u003c\u002fline\u003e\n\u003cline x1=\"70\" y1=\"30\" x2=\"70\" y2=\"250\" stroke=\"#0F2A35\" stroke-width=\"2\"\u003e\u003c\u002fline\u003e\n\u003cpath d=\"{{ bPath }}\" fill=\"none\" stroke=\"#B7791F\" stroke-width=\"3\" stroke-linejoin=\"round\"\u003e\u003c\u002fpath\u003e\n\u003ctext x=\"64\" y=\"36\" text-anchor=\"end\" font-family=\"Literata, Georgia, serif\" font-size=\"13\" fill=\"#0F2A35\"\u003e{{ bMax }}\u003c\u002ftext\u003e\n\u003ctext x=\"64\" y=\"254\" text-anchor=\"end\" font-family=\"Literata, Georgia, serif\" font-size=\"13\" fill=\"#0F2A35\"\u003e{{ bMin }}\u003c\u002ftext\u003e\n\u003ctext x=\"345\" y=\"288\" text-anchor=\"middle\" font-family=\"Literata, Georgia, serif\" font-size=\"14\" fill=\"#3F5560\"\u003eB-factor equivalent (Å²) by residue\u003c\u002ftext\u003e\n\u003c\u002fsvg\u003e\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:16px 36px;margin-top:20px;font-size:16px\"\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eResidues\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ bN }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eMean B\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ bMean }} Å²\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003cdiv\u003e\u003cdiv style=\"color:#3F5560;font-size:14px\"\u003eHighest B\u003c\u002fdiv\u003e\u003cdiv style=\"font-weight:600\"\u003e{{ bMax }} Å² at {{ bAt }}\u003c\u002fdiv\u003e\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fsc-if\u003e\n\u003c\u002fdiv\u003e\n\u003c\u002fdiv\u003e\n\
